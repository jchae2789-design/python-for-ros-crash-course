name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Student forks: run the tests of every day the student has started
  # (python next.py --ci), so a finished day shows a green check.
  test:
    if: github.event.repository.fork
    runs-on: ubuntu-24.04
    name: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run the tests of the started days
        run: python next.py --ci

  # Student forks: write the progress table (python next.py --report)
  # on the run's summary page, so the mentor sees every step.
  progress:
    if: github.event.repository.fork
    runs-on: ubuntu-24.04
    name: progress
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Progress table
        run: python next.py --report >> "$GITHUB_STEP_SUMMARY"

  # Course repository: the starter files are meant to fail, so only check
  # that every test file loads without errors.
  course-check:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect all tests
        run: pytest --collect-only
